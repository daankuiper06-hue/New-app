function project(){let p=findLegacy('project',selected);if(!p){go('projecten');return}let d=data(p),t=totals(p),c=findLegacy('klant',d.klant_id);let mat=t.mat.map(r=>`<tr><td>${esc(data(r).naam)}</td><td>${esc(data(r).aantal)}</td><td>${eur(num(data(r).verkoopprijs))}</td><td>${eur(num(data(r).aantal)*num(data(r).verkoopprijs))}</td><td><button class="alt" onclick="remove('${r.id}')">×</button></td></tr>`).join('');let hours=t.hours.map(r=>`<tr><td>${esc(data(findLegacy('medewerker',data(r).medewerker_id)).naam||'Onbekend')}</td><td>${esc(data(r).datum)}</td><td>${esc(data(r).aantal_uren)}</td><td>${eur(num(data(r).uurtarief))}</td><td><button class="alt" onclick="remove('${r.id}')">×</button></td></tr>`).join('');shell(`<div class="cards"><div class="card"><div class="muted">Verkoop materialen</div><div class="stat">${eur(t.mv)}</div></div><div class="card"><div class="muted">Verkoop arbeid</div><div class="stat">${eur(t.hv)}</div></div><div class="card"><div class="muted">Inkoop materialen</div><div class="stat">${eur(t.mi)}</div></div><div class="card"><div class="muted">Verschil vóór arbeidskosten*</div><div class="stat">${eur(t.total-t.mi)}</div></div></div><div class="card"><div class="row"><div><h2>${esc(d.projectnaam)}</h2><div class="muted">${esc(data(c).naam||'Geen klant')} · ${esc(d.klusadres||'')} · ${esc(d.datum||'')}</div></div><span class="pill">${esc(d.status||'Lopend')}</span></div><p>${esc(d.omschrijving||'')}</p><div class="toolbar"><button onclick="go('addmateriaal','${esc(selected)}')">+ Materiaal</button><button onclick="go('adduur','${esc(selected)}')">+ Uren</button><button class="alt" onclick="openDoc('werk')">Werkbon</button><button class="alt" onclick="openDoc('kosten')">Kostenoverzicht</button></div></div><div class="card"><h2>Materialen (${t.mat.length})</h2><div class="tablewrap"><table><thead><tr><th>Materiaal</th><th>Aantal</th><th>Verkoop/st.</th><th>Totaal</th><th></th></tr></thead><tbody>${mat}</tbody></table></div></div><div class="card"><h2>Uren (${t.hours.length})</h2><div class="tablewrap"><table><thead><tr><th>Medewerker</th><th>Datum</th><th>Uren</th><th>Verkooptarief</th><th></th></tr></thead><tbody>${hours}</tbody></table></div></div><div class="notice">* Dit is geen definitieve nettowinst: medewerkerskosten, eigen arbeidskosten en overige kosten worden nog niet volledig uit de historische data berekend.</div>`,'Klusoverzicht','Materialen, uren en documenten',`<button class="alt" onclick="go('projecten')">← Klussen</button>`)}
function addLine(type){let p=findLegacy('project',selected);if(!p)return go('projecten');let isMat=type==='materiaal';shell(`<div class="card"><form id="form">${isMat?`<div class="field"><label>Product uit bibliotheek (optioneel)</label><select id="productselect"><option value="">Handmatig invoeren</option>${by('product').map(r=>`<option value="${esc(r.id)}">${esc(data(r).naam)}</option>`).join('')}</select></div><div class="grid"><div class="field"><label>Omschrijving</label><input name="naam" id="naam" required></div><div class="field"><label>Aantal</label><input type="number" name="aantal" value="1" min="0.01" step="any" required></div><div class="field"><label>Inkoopprijs per stuk</label><input type="number" name="inkoopprijs" id="inkoop" step="0.01" min="0" required></div><div class="field"><label>Verkoopprijs per stuk</label><input type="number" name="verkoopprijs" id="verkoop" step="0.01" min="0" required></div></div>`:`<div class="grid"><div class="field"><label>Medewerker</label><select name="medewerker_id" required>${by('medewerker').map(r=>`<option value="${esc(rid(r))}">${esc(data(r).naam)}</option>`).join('')}</select></div><div class="field"><label>Datum</label><input name="datum" type="date" value="${today()}"></div><div class="field"><label>Uren</label><input name="aantal_uren" type="number" min="0.01" step="0.25" required></div><div class="field"><label>Verkooptarief per uur</label><input name="uurtarief" type="number" min="0" step="0.01" value="30" required></div></div><div class="field"><label>Werkzaamheden</label><textarea name="omschrijving"></textarea></div>`}<div class="toolbar"><button>Opslaan</button><button type="button" class="alt" onclick="go('project','${esc(selected)}')">Annuleren</button></div></form></div>`,isMat?'Materiaal toevoegen':'Uren toevoegen',data(p).projectnaam);if(isMat){$('#productselect').onchange=e=>{let r=records.find(r=>r.id===e.target.value);if(r){$('#naam').value=data(r).naam;$('#inkoop').value=data(r).inkoopprijs;$( function newSimple(t){let cols=t==='klant'?['naam','adres','postcode','plaats','telefoon','email']:t==='medewerker'?['naam','rol','uurtarief']:['naam','artikelnummer','leverancier','eenheid','inkoopprijs','verkoopprijs'];shell(`<div class="card"><form id="form"><div class="grid">${cols.map(c=>`<div class="field"><label>${c}</label><input name="${c}" ${c==='naam'?'required':''}></div>`).join('')}</div><button>Opslaan</button></form></div>`,'Toevoegen','Nieuwe '+t);$('#form').onsubmit=async e=>{e.preventDefault();if(await save(t,Object.fromEntries(new FormData(e.target))))go(t==='klant'?'klanten':t==='medewerker'?'medewerkers':'materialen')}}
function templates(){let saved=by('sjabloon')[0];template={...template,...data(saved)};shell(`<div class="card"><h2>Ontwerp je kostenoverzicht</h2><form id="form"><div class="grid"><div class="field"><label>Titel op document</label><input name="title" value="${esc(template.title)}"></div><div class="field"><label>Accentkleur</label><input type="color" name="accent" value="${esc(template.accent)}"></div></div>${[['showDate','Datum tonen'],['showQty','Aantal tonen'],['showPrice','Prijs per stuk tonen'],['showVat','Btw-specificatie tonen']].map(([k,l])=>`<p><label><input style="width:auto" type="checkbox" name="${k}" ${template[k]?'checked':''}> ${l}</label></p>`).join('')}<button>Sjabloon opslaan</button></form></div><div class="notice">Het sjabloon bepaalt alleen de opmaak. Materiaal- en urenregels op de werkbon blijven ook op het kostenoverzicht staan.</div>`,'Sjabloonmaker','Stel zelf je klantdocument in');$('#form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),d={title:f.get('title'),accent:f.get('accent'),showDate:f.has('showDate'),showQty:f.has('showQty'),showPrice:f.has('showPrice'),showVat:f.has('showVat')};let old=by('sjabloon')[0];if(old)await update(old,d);else await save('sjabloon',d);template=d}}
function openDoc(t){docType=t;page='document';render()}function documentView(){let p=findLegacy('project',selected);if(!p)return go('projecten');let d=data(p),c=data(findLegacy('klant',d.klant_id)),t=totals(p),cost=docType==='kosten',temp={...template,...data(by('sjabloon')[0])};let rows=[...t.mat.map(r=>({name:data(r).naam,qty:num(data(r).aantal),price:num(data(r).verkoopprijs),vat:num(data(r).btw_percentage)||21})),...t.hours.map(r=>({name:'Arbeid – '+(data(findLegacy('medewerker',data(r).medewerker_id)).naam||'medewerker'),qty:num(data(r).aantal_uren),price:num(data(r).uurtarief),vat:21}))];let sum=rows.reduce((s,r)=>s+r.qty*r.price,0);shell(`<div class="toolbar noprint"><button onclick="window.print()">Afdrukken / PDF</button><button class="alt" onclick="go('project','${esc(selected)}')">← Terug naar klus</button></div><div class="card"><div class="doc"><div class="dochead" style="border-color:${esc(temp.accent)}"><h1 style="margin:0;color:${esc(temp.accent)}">${cost?esc(temp.title):'Werkbon'}</h1><div class="muted">D Kuiper · Klusbeheer</div></div><div class="grid"><div><b>Klant</b><p>${esc(c.naam||'')}<br>${esc(c.adres||'')}<br>${esc(c.postcode||'')} ${esc(c.plaats||'')}</p></div><div><b>Project</b><p>${esc(d.projectnaam)}<br>${esc(d.klusadres||'')}${temp.showDate?'<br>'+esc(d.datum||''):''}</p></div></div><h3>Uitgevoerde werkzaamheden</h3><p>${esc(d.omschrijving||'Zie onderstaande materialen en uren.')}</p><div class="tablewrap"><table><thead><tr><th>Omschrijving</th>${temp.showQty?'<th>Aantal</th>':''}${cost&&temp.showPrice?'<th>Prijs</th>':''}${cost?'<th>Totaal</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td>${temp.showQty?`<td>${r.qty}</td>`:''}${cost&&temp.showPrice?`<td>${eur(r.price)}</td>`:''}${cost?`<td>${eur(r.qty*r.price)}</td>`:''}</tr>`).join('')}</tbody></table></div>${cost?`<div style="text-align:right;margin-top:25px"><h2>Totaal: ${eur(sum)}</h2><div class="muted">Btw-behandeling van historische prijzen is niet vastgesteld; controleer dit vóór verzending.</div></div>`:''}<p class="muted" style="margin-top:45px">${cost?'Kostenoverzicht, geen factuur.':'Werkbon, geen factuur.'}</p></div></div>` ,cost?'Kostenoverzicht':'Werkbon',d.projectnaam)}
async function logout(){await sb.auth.signOut();user=null;records=[];login()}
(async()=>{if(!sb){$('#app').innerHTML='<div class="card login"><h2>Verbinding niet geladen</h2><p>De externe Supabase-bibliotheek is geblokkeerd of niet beschikbaar. Probeer de online versie in plaats van het lokale HTML-bestand.</p></div>';return}let {data}=await sb.auth.getUser();user=data.user;if(user)await load();else login()})();
</script></body></html>
